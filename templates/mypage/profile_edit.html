<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/profile_edit.css' %}">
</head>
<body>
<!-- 공통 스타일과 일치하도록 최외곽 컨테이너 클래스 지정 -->
<div class="profile-edit-container">
    
    <!-- 상단 헤더 영역 (공통 뒤로가기 버튼 연동) -->
    <div class="profile-edit-header">
        <a href="{% url 'mypage' %}" class="btn-back"></a>
        <h1 class="profile-edit-title">프로필 편집</h1>
        <div class="header-empty-space"></div>
    </div>

    <form method="POST" action="{% url 'profile_edit' %}" enctype="multipart/form-data" class="profile-edit-form">
        {% csrf_token %}

        <!-- 프로필 이미지 섹션 -->
        <div class="profile-image-section">
            <div class="profile-img-wrapper">
                {% if user.profile_image %}
                    <img src="{{ user.profile_image.url }}" alt="프로필 이미지" class="profile-img">
                {% else %}
                    <img src="{% static 'images/profile_img.png' %}" alt="기본 프로필" class="profile-img">
                {% endif %}
            </div>
            <label for="profile_image" class="btn-image-edit">프로필 사진 수정</label>
            <input type="file" id="profile_image" name="profile_image" accept="image/*" style="display:none;">
        </div>

        <!-- 입력 정보 리스트 영역 -->
        <div class="edit-form-list">
            <!-- 닉네임 -->
            <div class="edit-item">
                <label class="edit-label">닉네임</label>
                <input type="text" name="nickname" class="edit-input" value="{{ user.nickname }}">
            </div>

            <!-- 아이디 (수정 불가) -->
            <div class="edit-item">
                <label class="edit-label">아이디</label>
                <span class="readonly-text">{{ user.username }}</span>
            </div>

            <!-- 비밀번호 변경 -->
            <div class="edit-item">
                <label class="edit-label">비밀번호 변경</label>
                <input type="password" name="password" class="edit-input" placeholder="새 비밀번호 입력">
            </div>
        </div>

        <!-- 저장 버튼 -->
        <button type="submit" class="btn-save">저장</button>
    </form>

    <!-- 회원 탈퇴 / 로그아웃 하단 링크 구역 -->
    <div class="account-actions">
        <form method="POST" action="{% url 'delete_account' %}" class="delete-account-form">
            {% csrf_token %}
            <button type="submit" class="btn-action-text">회원 탈퇴하기</button>
        </form>
        <span class="actions-divider">|</span>
        <a href="{% url 'logout' %}" class="btn-action-text">로그아웃하기</a>
    </div>
</div>
</body>
</html>
