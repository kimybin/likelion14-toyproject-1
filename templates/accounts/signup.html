<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작심삼인</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="signup-container">
    <a href="{% url 'login_home' %}" class="btn-back">&lt;</a>
    <h1 class="signup-title">회원가입</h1>

    <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}

            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}

            <div class="signup-form">
                <label>아이디</label>
                <input type="text" name="username" placeholder="영문 또는 영문, 숫자 조합 4~16자에요">

                <label>비밀번호</label>
                <input type="password" name="password" placeholder="영문, 숫자 포함 10자 이상이에요">

                <label>비밀번호 확인</label>
                <input type="password" name="password_confirm" placeholder="동일한 비밀번호를 입력하세요">

                <label>닉네임</label>
                <input type="text" name="nickname" placeholder="작심삼인에서 사용할 닉네임을 입력하세요">

                <label>이메일</label>
                <input type="email" name="email" placeholder="예시) 12345678@naver.com">

                <button type="submit" class="btn-signup">회원가입 하기</button>
            </div>
        </form>

        <div class="login-link">
            이미 계정이 있어요 <a href="{% url 'login' %}">로그인</a>
        </div>
</div>

</body>
