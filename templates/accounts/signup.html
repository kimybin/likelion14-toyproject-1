<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작심삼인 - 회원가입</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login_home.css' %}">
</head>
<body>
    <div class="signup-container">

        <div class="signup-header">
            <a href="{% url 'login_home' %}" class="btn-back"></a>
            <h1 class="signup-title">회원가입</h1>
        </div>

        <div class="signup-content-scroll-wrap">
            <form method="POST" action="{% url 'signup' %}" class="login-input-form">
                {% csrf_token %}

                {% if error %}
                <p class="error-message">{{ error }}</p>
                {% endif %}

                <div class="input-group">
                    <label>아이디</label>
                    <input type="text" name="username" placeholder="영문 또는 영문, 숫자 조합 4~16자에요" required>
                </div>

                <div class="input-group">
                    <label>비밀번호</label>
                    <input type="password" name="password" placeholder="영문, 숫자 포함 10자 이상이에요" required>
                </div>

                <div class="input-group">
                    <label>비밀번호 확인</label>
                    <input type="password" name="password_confirm" placeholder="동일한 비밀번호를 입력하세요" required>
                </div>

                <div class="input-group">
                    <label>닉네임</label>
                    <input type="text" name="nickname" placeholder="작심삼인에서 사용할 닉네임을 입력하세요" required>
                </div>

                <div class="input-group">
                    <label>이메일</label>
                    <input type="email" name="email" placeholder="예시) 12345678@naver.com" required>
                </div>

                <button type="submit" class="btn-login btn-signup-submit">회원가입 하기</button>
            </form>

            <div class="signup-prompt-wrap">
                <span>이미 계정이 있어요</span>
                <a href="{% url 'login' %}" class="btn-signup-link">로그인</a>
            </div>
        </div>

    </div>
</body>
</html>
