<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작심삼인 - 인기목표</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login_home.css' %}">
</head>
<body>
    <div class="goal-container login-container">

        <div class="signup-header goal-header">
            <a href="{% url 'team_name' %}" class="btn-back"></a>
            <span class="signup-title goal-header-title">인기목표</span>
            <a href="{% url 'goal_custom' %}" class="btn-custom-link">직접 입력하기</a>
        </div>

        <h1 class="login-home-title team-main-title">
            가장 많이 도전하는<br>
            <span class="highlight">목표 주제</span>를 가져왔어요
        </h1>
        <p class="team-subtitle">
            어떤 목표를 세울지 고민된다면<br>
            인기 주제를 확인해보세요.
        </p>

        <div class="signup-content-scroll-wrap goal-list-wrap">
            <div class="goal-list">
                {% for goal in popular_goals %}
                <button type="button" class="goal-item" data-goal="{{ goal.title }}">
                    <img src="{% static goal.icon %}" alt="{{ goal.title }}" class="goal-icon-img">
                    <span class="goal-text">{{ goal.title }}</span>
                    <span class="goal-arrow"></span>
                </button>
                {% endfor %}
            </div>
        </div>
    </div>

    <form id="goal-form" method="POST" action="{% url 'goal' %}">
        {% csrf_token %}
        <input type="hidden" name="goal" id="selected-goal">
    </form>

    <script>
    document.querySelectorAll('.goal-item').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.getElementById('selected-goal').value = this.dataset.goal;
            document.getElementById('goal-form').submit();
        });
    });
    </script>
</body>
</html>
